name: Build & publish Windows zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v0.4
      base_tag:
        description: Existing release supplying the compatible base zip (read only)
        default: v0.3
      publish:
        description: Upload the final zip and publish the release (false = build + smoke test only)
        type: boolean
        default: false

permissions:
  contents: write

env:
  BASE_ASSET: XiaoLi-${{ inputs.base_tag }}-base-no-model.zip
  FINAL_ASSET: XiaoLi-${{ inputs.tag }}-Windows-x64.zip
  MODEL_URL: https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf
  MODEL_SHA256: b139949c5bd74937ad8ed8c8cf3d9ffb1e99c866c823204dc42c0d91fa181897
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Download base zip from the release
        run: gh release download "${{ inputs.base_tag }}" -p "$BASE_ASSET" -D build --clobber

      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build launcher from checked-out source
        run: |
          cd launcher
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o ../build/小离.exe .

      - name: Download and verify CPU TTS assets
        run: python .github/release/prepare_tts.py build/tts-cache build/tts-stage

      - name: Compile persistent TTS worker (MSVC static runtime)
        shell: cmd
        run: cl /nologo /O2 /MT /utf-8 /I tts tts\worker.c /Fe:build\tts-stage\runtime\tts\xiaoli-tts.exe /link /LIBPATH:build\tts-cache\sherpa-onnx-v1.13.8-win-x64-shared-MT-Release-lib\lib sherpa-onnx-c-api.lib

      - name: Compile persistent ASR worker (shared sherpa runtime)
        shell: cmd
        run: cl /nologo /O2 /MT /utf-8 /I tts tts\asr_worker.c /Fe:build\tts-stage\runtime\tts\xiaoli-asr.exe /link /LIBPATH:build\tts-cache\sherpa-onnx-v1.13.8-win-x64-shared-MT-Release-lib\lib sherpa-onnx-c-api.lib

      - name: Keep Windows TTS stage and launcher for local test packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-v0.4-test-no-gguf-stage
          retention-days: 7
          if-no-files-found: error
          path: |
            build/tts-stage/
            build/小离.exe

      - name: Download model
        run: curl -fL --retry 5 --retry-delay 5 -o build/model.gguf "$MODEL_URL"

      - name: Assemble final zip
        run: python .github/release/assemble.py "build/$BASE_ASSET" build/model.gguf "$MODEL_SHA256" "build/$FINAL_ASSET" build/tts-stage build/小离.exe

      - name: Size and checksum
        run: |
          ls -l "build/$FINAL_ASSET"
          sha256sum "build/$FINAL_ASSET" | tee build/sha256.txt
          stat -c %s "build/$FINAL_ASSET" > build/size-bytes.txt
          echo "**$FINAL_ASSET** $(stat -c %s build/$FINAL_ASSET) bytes, sha256 \`$(cut -d' ' -f1 build/sha256.txt)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Real-Windows smoke test
        run: |
          pip install psutil==7.0.0 playwright==1.56.0
          python -m playwright install chromium
          python .github/release/smoke_test.py "build/$FINAL_ASSET" "$RUNNER_TEMP/smoke"

      - name: Keep local-build checks and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-v0.4-validation
          path: |
            build/sha256.txt
            build/size-bytes.txt
            build/tts-stage/TTS-ASSETS-SHA256.json
            ${{ runner.temp }}/smoke/metrics.json
            ${{ runner.temp }}/smoke/*.wav
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/*.log

      - name: Upload to release and publish
        if: ${{ inputs.publish }}
        run: |
          gh release upload "${{ inputs.tag }}" "build/$FINAL_ASSET" --clobber
          gh release delete-asset "${{ inputs.tag }}" "$BASE_ASSET" -y || true
          gh release edit "${{ inputs.tag }}" --draft=false --latest
          gh release view "${{ inputs.tag }}" --json url,isDraft,assets
