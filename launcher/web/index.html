<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小离</title>
<link rel="icon" href="favicon.png">
<style>
  :root { color-scheme: dark; --column: min(560px, 46vw); --input-height: 52px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: #20222b; color: rgb(255,252,246); overflow: hidden; }
  .app { position: relative; width: 100%; height: 100%; overflow: hidden;
    background: url(office_morning.jpg) 62% center / cover no-repeat; }
  .app::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(10,12,20,.47), transparent 8%),
      linear-gradient(to bottom, transparent 60%, rgba(10,12,20,.78)); }
  .info, .msg.her, .wake { background: rgba(20,24,36,.47); backdrop-filter: blur(13px);
    border: 1px solid rgba(255,255,255,.24); box-shadow: 0 8px 28px rgba(0,0,0,.16); }
  .info { position: absolute; left: 26px; top: 24px; border-radius: 18px; padding: 14px 20px; }
  .date { font-size: 13px; color: rgba(255,255,255,.78); }
  .greeting { margin-top: 7px; font-size: 17px; font-weight: 500; color: #fff; }
  .chat { position: absolute; left: 40px; bottom: calc(150px + var(--input-height) - 52px);
    width: var(--column); max-height: min(45vh, calc(100% - 270px)); overflow-y: auto;
    mask-image: linear-gradient(to bottom, transparent, #000 24px);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 24px);
    padding: 26px 6px 4px 0; display: flex; flex-direction: column; gap: 12px;
    overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.3) transparent; }
  .msg { flex: none; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.her { position: relative; align-self: flex-start; width: 100%; margin-top: 25px;
    padding: 16px 24px; border-radius: 22px; font-size: 19px; line-height: 32px; }
  .msg.her::before { content: "小离"; position: absolute; left: 8px; top: -29px;
    font-size: 14px; line-height: 24px; font-weight: 500; color: rgb(255,214,170); }
  .msg.me { align-self: flex-end; max-width: 90%; padding: 9px 16px; border-radius: 18px;
    font-size: 15px; line-height: 24px; background: rgba(255,255,255,.18); backdrop-filter: blur(13px); }
  .msg.older { opacity: .45; font-size: 15px; line-height: 25px; }
  .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 3px; border-radius: 50%;
    background: rgb(255,214,170); animation: b 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
  .chips { position: absolute; left: 40px; bottom: calc(52px + var(--input-height));
    display: flex; flex-wrap: wrap; gap: 6px; width: min(560px, calc(100vw - 180px)); }
  .app:has(.chips:not(.hidden)) .chat { bottom: calc(190px + var(--input-height) - 52px); }
  .chip { border: 1px solid rgba(255,255,255,.3); background: rgba(20,24,36,.35); color: #fff;
    backdrop-filter: blur(13px); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { background: rgba(255,255,255,.28); }
  .bar { position: absolute; left: 40px; bottom: 40px; display: flex; align-items: center; gap: 16px; }
  .composer { width: var(--composer, min(520px, calc(100vw - 180px))); min-height: 52px; display: flex; align-items: center;
    padding: 5px 7px 5px 16px; gap: 8px; border-radius: 26px; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(13px); }
  textarea { flex: 1; min-width: 0; width: 0; resize: none; border: 0; outline: none;
    padding: 8px 0; font: inherit; font-size: 16px; line-height: 24px; height: 40px; max-height: 120px;
    background: transparent; color: #fff; }
  textarea::placeholder { color: rgba(255,255,255,.67); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .send { flex: none; height: 36px; padding: 0 13px; border: 0; border-radius: 20px;
    background: #d99465; color: #fff; font: inherit; font-size: 14px; cursor: pointer; }
  .send:disabled { opacity: .45; cursor: default; }
  .voice { position: absolute; top: 24px; right: 24px; border-radius: 999px; padding: 10px 16px;
    color: #fff; font: inherit; font-size: 14px; cursor: pointer; background: rgba(20,24,36,.47);
    backdrop-filter: blur(13px); border: 1px solid rgba(255,255,255,.3); box-shadow: 0 8px 28px rgba(0,0,0,.16); }
  .voice:hover { background: rgba(70,60,55,.65); }
  .mic-wrap { display: inline-flex; flex: none; }
  .mic { width: 68px; height: 68px; display: grid; place-items: center; border: 0; border-radius: 50%;
    background: rgb(250,240,228); color: rgb(150,96,60); box-shadow: 0 0 24px rgba(255,200,150,.45);
    opacity: .55; cursor: not-allowed; }
  .mic svg { width: 28px; height: 28px; }
  .wake { position: absolute; left: 40px; bottom: calc(150px + var(--input-height) - 52px);
    width: var(--column); border-radius: 22px; padding: 20px 24px; font-size: 17px; line-height: 1.7; }
  button:focus-visible { outline: 2px solid rgb(255,214,170); outline-offset: 3px; }
  .composer:focus-within { border-color: rgba(255,255,255,.65); }
  .hidden { display: none !important; }
  @media (min-width: 760px) and (max-aspect-ratio: 5/4) {
    :root { --column: max(300px, min(360px, 40vw)); }
    .app { background-position: 28% center; }
  }
  @media (max-width: 759px) {
    :root { --column: calc(100vw - 48px); }
    .app { background-position: 35% center; }
    .info { left: 24px; }
    .chat, .wake, .chips, .bar { left: 24px; }
    .composer { width: calc(100vw - 132px); }
    .chips { width: calc(100vw - 48px); }
    .mic { width: 60px; height: 60px; }
    .bar { bottom: 24px; }
    .chat, .wake { bottom: calc(150px + var(--input-height) - 52px); }
  }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="info"><div class="date" id="date"></div><div class="greeting" id="greeting"></div></div>
  <button class="voice" id="voice" aria-pressed="false">声音开启</button>
  <div class="chat" id="chat"></div>
  <div class="chips hidden" id="chips"></div>
  <div class="bar">
    <div class="composer">
      <textarea id="input" rows="1" aria-label="输入消息" placeholder="想说什么，在这里打字…" disabled></textarea>
      <button class="send" id="send" aria-label="发送" disabled>发送</button>
    </div>
    <span class="mic-wrap" title="麦克风暂未开放，请打字聊天">
      <button class="mic" disabled aria-disabled="true" aria-label="麦克风暂未开放，请打字聊天">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M8 22h8"/>
        </svg>
      </button>
    </span>
  </div>
  <div class="wake" id="wake">小离正在醒来，稍等一下下…<br><span class="dots"><span></span><span></span><span></span></span></div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const chips = document.getElementById('chips');
const wake = document.getElementById('wake');
const history = [];   // {role, content}
let busy = false;


// Sentence pipeline: reveal each sentence when its audio starts; one synthesis at a time,
// playback in order, with synthesis of the next sentence overlapping playback.
const voice = document.getElementById('voice');
let muted = false;
try { muted = localStorage.getItem('xiaoli-muted') === 'true'; } catch(e) {}
let audioContext, activeSource, audioEpoch = 0;
let flushSubtitle = null;
let lastSendAt = null;
let synthChain = Promise.resolve(), playChain = Promise.resolve();
function voiceLabel() {
  voice.textContent = muted ? '声音关闭' : '声音开启';
  voice.setAttribute('aria-pressed', String(muted));
  voice.setAttribute('aria-label', muted ? '开启声音' : '关闭声音');
  voice.title = muted ? '点击开启回复朗读' : '点击关闭回复朗读；浏览器首次播放需点击页面';
}
voiceLabel();
function stopAudio() {
  if (flushSubtitle) { flushSubtitle(); flushSubtitle = null; }
  audioEpoch++;
  if (activeSource) { try { activeSource.stop(); } catch(e) {} activeSource = null; }
}
function unlockAudio() {
  if (!audioContext) audioContext = new AudioContext();
  if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
}
voice.onclick = () => {
  muted = !muted;
  try { localStorage.setItem('xiaoli-muted', String(muted)); } catch(e) {}
  stopAudio(); voiceLabel();
  if (!muted) unlockAudio();
};
document.addEventListener('pointerdown', () => { if (!muted) unlockAudio(); });
document.addEventListener('keydown', () => { if (!muted) unlockAudio(); });
function spoken(t) {
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/<[^>]*>|https?:\/\/\S+/g, '')
    .replace(/[^\p{L}\p{N}\s。，！？!?；;：:、,.…（）()'\-]/gu, '').trim();
}
function queueSentence(text, reveal = () => {}) {
  text = spoken(text);
  if (muted || !audioContext || audioContext.state !== 'running') { reveal(); return; }
  if (!/[\p{L}\p{N}]/u.test(text)) { playChain = playChain.then(reveal); return; }
  const epoch = audioEpoch, completed = performance.now();
  const generated = synthChain.then(async () => {
    if (epoch !== audioEpoch || muted) return null;
    try {
      const res = await fetch('/api/tts', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text}), signal: AbortSignal.timeout(35000)});
      if (!res.ok || res.status === 204) return null;
      const wav = await res.arrayBuffer();
      if (epoch !== audioEpoch || muted) return null;
      if (!audioContext || audioContext.state !== 'running') return null;
      return await audioContext.decodeAudioData(wav);
    } catch(e) { console.info('TTS silent fallback', String(e)); return null; }
  });
  synthChain = generated.then(() => {});
  playChain = playChain.then(async () => {
    const buffer = await generated;
    reveal();
    if (!buffer || muted || epoch !== audioEpoch) return;
    await new Promise(resolve => {
      const source = audioContext.createBufferSource();
      source.buffer = buffer; source.connect(audioContext.destination); activeSource = source;
      source.onended = () => { if (activeSource === source) activeSource = null; resolve(); };
      console.info('TTS_PLAY', JSON.stringify({text, delay_ms:performance.now()-completed, duration:buffer.duration, send_to_play_ms:lastSendAt === null ? null : performance.now()-lastSendAt, output_latency_ms:1000*(audioContext.outputLatency || audioContext.baseLatency || 0)}));
      source.start();
    });
  }).catch(e => console.info('TTS playback fallback', String(e)));
}
function sentenceStream(onSentence = () => {}) {
  let consumed = 0;
  return (text, final = false) => {
    let rest = text.slice(consumed);
    while (rest.length) {
      let n = rest.search(/[。！？!?；;…\n]/u);
      n = n >= 0 ? n + 1 : 0;
      // Start speaking at the first natural clause, with a 12-character cap.
      // Later chunks retain longer phrasing and synthesize during playback.
      if (consumed === 0) {
        const clause = rest.search(/[，,、：:]/u);
        if (clause >= 0 && (!n || clause + 1 < n)) n = clause + 1;
        if ((!n || n > 12) && rest.length >= 12) n = 12;
      }
      // Avoid very long utterances: comma after 24 chars, hard cap 72 chars.
      if (!n || n > 72) {
        const comma = rest.slice(24,72).search(/[，,、：:]/u);
        n = comma >= 0 ? 25 + comma : (rest.length >= 72 ? 72 : 0);
      }
      if (!n && final) n = rest.length;
      if (!n) break;
      const sentence = rest.slice(0,n);
      consumed += n;
      const prefix = text.slice(0,consumed);
      queueSentence(sentence, () => onSentence(prefix));
      rest = rest.slice(n);
    }
  };
}

// Keep the app alive while this window is open.
try { new EventSource('/api/alive'); } catch (e) {}

function greetingWord() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return '早上好';
  if (h >= 11 && h < 13) return '中午好';
  if (h >= 13 && h < 18) return '下午好';
  return '晚上好';
}

// Keep 小离 (right side of the picture) clear of the UI: pick the background offset that pushes her
// right edge (~77% of the image) to the window's right edge, then size the subtitle column and
// input bar so they end before her shoulder (~40% of the image width).
const app = document.querySelector('.app');
function layout() {
  const W = innerWidth, H = innerHeight, s = Math.max(W / 1654, H / 951), iw = 1654 * s;
  const off = Math.min(iw - W, Math.max(0, 0.77 * iw - W));
  app.style.backgroundPosition = (-off) + 'px center';
  const root = document.documentElement.style;
  if (W < 760) { root.removeProperty('--column'); root.removeProperty('--composer'); return; }
  const safe = 0.40 * iw - off - 24;   // px from the left edge where her shoulder begins
  root.setProperty('--column', Math.round(Math.max(300, Math.min(560, safe - 40))) + 'px');
  root.setProperty('--composer', Math.round(Math.max(340, Math.min(520, safe - 40 - 84))) + 'px');
}
layout();
addEventListener('resize', layout);

function updateClock() {
  const now = new Date();
  document.getElementById('date').textContent = '今天 · 周' + '日一二三四五六'[now.getDay()] + ' · ' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
  document.getElementById('greeting').textContent = greetingWord() + ' · ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}
updateClock();
setInterval(updateClock, 30000);

// Remove any thinking text and simple formatting marks the small model may produce.
function tidy(t) {
  t = t.replace(/<think>[\s\S]*?<\/think>/g, '').replace(/<think>[\s\S]*$/, '').replace(/<\/?think>/g, '');
  t = t.replace(/\/no_think/g, '').replace(/\*\*/g, '').replace(/^#{1,6}\s*/gm, '');
  return t.replace(/[ \t]+\n/g, '\n').replace(/^\s+/, '');
}

function addBubble(who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'me' ? 'me' : 'her');
  d.textContent = text;
  if (who === 'me') {
    for (const message of chat.children) message.classList.add('older');
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function typingBubble() {
  const d = addBubble('her', '');
  d.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  return d;
}

function setBusy(b) {
  busy = b;
  send.disabled = b;
  input.disabled = false;
  if (!b) input.focus();
}

async function typeOut(el, text) {
  el.textContent = '';
  for (const ch of text) {
    el.textContent += ch;
    chat.scrollTop = chat.scrollHeight;
    await new Promise(r => setTimeout(r, 28));
  }
}

function showChips() {
  const ideas = ['帮我写一条请假消息', '这条短信是不是骗子？', '今晚吃点什么好？', '陪我随便聊聊'];
  chips.innerHTML = '';
  for (const s of ideas) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = s;
    b.onclick = () => { input.value = s; ask(); };
    chips.appendChild(b);
  }
  chips.classList.remove('hidden');
}

async function ask() {
  const text = input.value.trim();
  if (!text || busy) return;
  stopAudio();
  if (!muted) unlockAudio();
  chips.classList.add('hidden');
  input.value = ''; autosize();
  addBubble('me', text);
  history.push({ role: 'user', content: text });
  setBusy(true);
  const bubble = typingBubble();
  let raw = '';
  let revealed = 0;
  const reveal = text => {
    if (text.length < revealed) return;
    revealed = text.length; bubble.textContent = text; chat.scrollTop = chat.scrollHeight;
  };
  flushSubtitle = () => reveal(tidy(raw));
  lastSendAt = performance.now();
  const speak = sentenceStream(reveal);
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history.slice(-20) })
    });
    if (!res.ok || !res.body) throw new Error('bad');
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const j = JSON.parse(data);
          const piece = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (piece) {
            raw += piece;
            const shown = tidy(raw);
            if (shown) {
              if (muted || !audioContext || audioContext.state !== 'running') reveal(shown);
              speak(shown);
            }
          }
        } catch (e) {}
      }
    }
    const final = tidy(raw).trim();
    if (!final) throw new Error('empty');
    speak(final, true);
    history.push({ role: 'assistant', content: final });
  } catch (e) {
    stopAudio();
    bubble.textContent = '哎呀，我刚才走神了，没听清。你能再说一遍吗？';
    history.pop();
  }
  setBusy(false);
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; document.documentElement.style.setProperty('--input-height', Math.max(52, input.offsetHeight + 12) + 'px'); }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); ask(); }
});
send.onclick = ask;

async function waitForBrain() {
  for (;;) {
    try {
      const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
      if (s.ready) return true;
      if (s.failed) { wake.innerHTML = s.message || '小离没能醒来，请关掉窗口再试一次。'; return false; }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 500));
  }
}

(async () => {
  const ok = await waitForBrain();
  if (!ok) return;
  wake.classList.add('hidden');
  const hello = greetingWord() + '呀！我是小离～\n有什么想问的、想聊的，直接在下面打字告诉我就好。不知道说什么的话，点点下面的小卡片也行。';
  const b = addBubble('her', '');
  if (audioContext && audioContext.state === 'running') sentenceStream()(hello, true);
  await typeOut(b, hello);
  history.push({ role: 'assistant', content: hello });
  showChips();
  input.disabled = false; send.disabled = false; input.focus();
})();
</script>
</body>
</html>
