<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="xiaoli-build" content="__XIAOLI_BUILD__">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小离</title>
<link rel="icon" href="favicon.png">
<style>
  :root { color-scheme: dark; --column: min(560px, 46vw); --input-height: 52px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: #20222b; color: rgb(255,252,246); overflow: hidden; }
  .app { position: relative; width: 100%; height: 100%; overflow: hidden;
    background: url(office_morning.jpg) 62% center / cover no-repeat; }
  .avatar { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .avatar::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(10,12,20,.47), transparent 8%),
      linear-gradient(to bottom, transparent 60%, rgba(10,12,20,.78)); }
  .avatar video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:62% center;
    opacity:0; transition:opacity 360ms ease; }
  .avatar video.active { opacity:1; }
  @media (min-width:760px) and (max-aspect-ratio:5/4) { .avatar video { object-position:28% center; } }
  @media (max-width:759px) { .avatar video { object-position:35% center; } }
  @media (prefers-reduced-motion:reduce) { .avatar video { transition:none; } }
  .app::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(10,12,20,.47), transparent 8%),
      linear-gradient(to bottom, transparent 60%, rgba(10,12,20,.78)); }
  .info, .msg.her, .wake { background: rgba(20,24,36,.47); backdrop-filter: blur(13px);
    border: 1px solid rgba(255,255,255,.24); box-shadow: 0 8px 28px rgba(0,0,0,.16); }
  .info { position: absolute; left: 26px; top: 24px; border-radius: 18px; padding: 14px 20px; }
  .date { font-size: 13px; color: rgba(255,255,255,.78); }
  .greeting { margin-top: 7px; font-size: 17px; font-weight: 500; color: #fff; }
  .chat { position: absolute; left: 40px; bottom: calc(150px + var(--input-height) - 52px);
    width: var(--column); max-height: min(45vh, calc(100% - 270px)); overflow-y: auto;
    padding: 26px 6px 4px 0; display: flex; flex-direction: column; gap: 12px;
    overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.3) transparent; }
  .msg { flex: none; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.her { position: relative; align-self: flex-start; width: 100%; margin-top: 25px;
    padding: 16px 24px; border-radius: 22px; font-size: 19px; line-height: 32px; }
  .msg.her::before { content: "小离"; position: absolute; left: 8px; top: -29px;
    font-size: 14px; line-height: 24px; font-weight: 500; color: rgb(255,214,170); }
  .msg.me { align-self: flex-end; max-width: 90%; padding: 9px 16px; border-radius: 18px;
    font-size: 15px; line-height: 24px; background: rgba(255,255,255,.18); backdrop-filter: blur(13px); }
  .msg.older { opacity: 1; font-size: 15px; line-height: 25px; }
  .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 3px; border-radius: 50%;
    background: rgb(255,214,170); animation: b 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
  .chips { position: absolute; left: 40px; bottom: calc(52px + var(--input-height));
    display: flex; flex-wrap: wrap; gap: 6px; width: min(560px, calc(100vw - 180px)); }
  .app:has(.chips:not(.hidden)) .chat { bottom: calc(190px + var(--input-height) - 52px); }
  .chip { border: 1px solid rgba(255,255,255,.3); background: rgba(20,24,36,.35); color: #fff;
    backdrop-filter: blur(13px); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { background: rgba(255,255,255,.28); }
  .bar { position: absolute; left: 40px; bottom: 40px; display: flex; align-items: center; gap: 16px; }
  .composer { width: var(--composer, min(520px, calc(100vw - 180px))); min-height: 52px; display: flex; align-items: center;
    padding: 5px 7px 5px 16px; gap: 8px; border-radius: 26px; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(13px); }
  textarea { flex: 1; min-width: 0; width: 0; resize: none; border: 0; outline: none;
    padding: 8px 0; font: inherit; font-size: 16px; line-height: 24px; height: 40px; max-height: 120px;
    background: transparent; color: #fff; }
  textarea::placeholder { color: rgba(255,255,255,.67); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .send { flex: none; height: 36px; padding: 0 13px; border: 0; border-radius: 20px;
    background: #d99465; color: #fff; font: inherit; font-size: 14px; cursor: pointer; }
  .send:disabled { opacity: .45; cursor: default; }
  .voice { position: absolute; top: 24px; right: 24px; border-radius: 999px; padding: 10px 16px;
    color: #fff; font: inherit; font-size: 14px; cursor: pointer; background: rgba(20,24,36,.47);
    backdrop-filter: blur(13px); border: 1px solid rgba(255,255,255,.3); box-shadow: 0 8px 28px rgba(0,0,0,.16); }
  .voice:hover { background: rgba(70,60,55,.65); }
  .chat-toggle {position:relative; background:#141824;color:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:10px;cursor:pointer;}
  .chat-tip {display:none;position:absolute;bottom:110%;right:0;width:270px;background:#141824;color:#cbd5e1;padding:12px;border-radius:10px;font-size:14px;line-height:1.5;}
  .chat-toggle:hover .chat-tip,.chat-toggle:focus-visible .chat-tip {display:block;}
  .bar {gap:8px;}
  .mic-wrap { display: inline-flex; flex: none; }
  .mic { width: 68px; height: 68px; display: grid; place-items: center; border: 0; border-radius: 50%;
    background: rgb(250,240,228); color: rgb(150,96,60); box-shadow: 0 0 24px rgba(255,200,150,.45);
    cursor: pointer; }
  .mic:disabled { opacity: .55; cursor: not-allowed; }
  .mic.listening { background: #b96050; color: white; animation: listening 1s infinite alternate; }
  @keyframes listening { to { box-shadow: 0 0 0 10px rgba(185,96,80,.25); } }
  .mic svg { width: 28px; height: 28px; }
  .wake { position: absolute; left: 40px; bottom: calc(150px + var(--input-height) - 52px);
    width: var(--column); border-radius: 22px; padding: 20px 24px; font-size: 17px; line-height: 1.7; }
  button:focus-visible { outline: 2px solid rgb(255,214,170); outline-offset: 3px; }
  .composer:focus-within { border-color: rgba(255,255,255,.65); }
  .hidden { display: none !important; }
  /* The darkest guaranteed glass over a white wallpaper. No ancestor opacity/mask. */
  .msg.her, .msg.me, .info, .wake, .composer, .voice, .chip, .chip:hover, .voice:hover,
  .msg.her::before, .asr-status {
    background: rgba(20,24,36,.80); color: #fff;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    text-shadow: 0 1px 2px rgba(0,0,0,.85);
  }
  .msg.her::before { color: #ffd6aa; padding: 1px 8px; border-radius: 7px; left: 8px; }
  .date, textarea::placeholder, textarea.asr-partial { color: #cbd5e1; opacity: 1; }
  .send { background: #87421f; }
  .send:disabled { opacity: 1; background: #52382b; color: #cbd5e1; }
  .mic { touch-action: none; user-select: none; }
  .mic.listening { background: #873c30; }
  .asr-status { position: absolute; bottom: calc(100% + 8px); left: 0;
    padding: 6px 12px; border-radius: 10px; font-size: 14px; color: #cbd5e1; max-width: 100%; line-height: 1.5; }
  @supports not (backdrop-filter: blur(1px)) {
    .msg.her, .msg.me, .msg.her::before, .info, .wake, .composer, .voice, .chip,
    .chip:hover, .voice:hover, .asr-status { background: rgb(20,24,36); }
  }
  @media (min-width: 760px) and (max-aspect-ratio: 5/4) {
    :root { --column: max(300px, min(360px, 40vw)); }
    .app { background-position: 28% center; }
  }
  @media (max-width: 759px) {
    :root { --column: calc(100vw - 48px); }
    .app { background-position: 35% center; }
    .info { left: 24px; }
    .chat, .wake, .chips, .bar { left: 24px; }
    .composer { width: calc(100vw - 224px); }
    .chips { width: calc(100vw - 48px); }
    .mic { width: 60px; height: 60px; }
    .bar { bottom: 24px; }
    .chat, .wake { bottom: calc(150px + var(--input-height) - 52px); }
  }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="avatar" id="avatar" aria-hidden="true"></div>
  <div class="info"><div class="date" id="date"></div><div class="greeting" id="greeting"></div></div>
  <button class="voice" id="voice" aria-pressed="false">声音开启</button>
  <div class="chat" id="chat"></div>
  <div class="chips hidden" id="chips"></div>
  <div class="bar">
    <div id="asr-status" class="asr-status hidden" role="status" aria-live="polite"></div>
    <div class="composer">
      <textarea id="input" rows="1" aria-label="输入消息" placeholder="想说什么，在这里打字…" disabled></textarea>
      <button class="send" id="send" aria-label="发送" disabled>发送</button>
    </div>
    <button id="chat-mode" class="chat-toggle" aria-pressed="false" aria-describedby="chat-tip">聊天模式<span id="chat-tip" role="tooltip" class="chat-tip">开启后像打电话：一直听你说，停顿约 1.5 秒自动发送；小离说完会继续听。再点一次关闭。麦克风可打断，Esc 退出。</span></button>
    <span class="mic-wrap" title="点按开始，再点结束；按住说话，滑出取消">
      <button class="mic" id="mic" disabled aria-pressed="false" aria-label="点按开始，再点结束；按住说话，滑出取消">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M8 22h8"/>
        </svg>
      </button>
    </span>
  </div>
  <div class="wake" id="wake">小离正在醒来，稍等一下下…<br><span class="dots"><span></span><span></span><span></span></span></div>
</div>
<script src="/build-state.js"></script>
<script src="/asr-state.js"></script>
<script src="/chat-state.js"></script>
<script src="/avatar-state.js"></script>
<script>
const avatarRoot=document.getElementById('avatar');
const avatarVideos=[0,1].map(()=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.loop=true;avatarRoot.appendChild(v);return v;});
let avatarLayer=0, avatarState='', avatarFailed=false, avatarRequest=0, avatarPending=false;
function showAvatar(state){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const src='/anim/'+state+'.mp4';
  if(state===avatarState && avatarPending)return;
  const current=avatarVideos[avatarLayer];
  const same=state===avatarState && current.dataset.state===state && (current.currentSrc.endsWith('/'+state+'.mp4')||current.src.endsWith('/'+state+'.mp4')||(current.getAttribute('src')||'')===src);
  if(same){
    current.loop=!reduced;
    if(reduced){if(!current.paused)current.pause();if(current.currentTime!==0)current.currentTime=0;}
    else if(current.paused)current.play().catch(()=>{});
    return;
  }
  avatarState=state; avatarPending=true; const request=++avatarRequest; if(avatarFailed){avatarPending=false;return;}
  const old=avatarVideos[avatarLayer],target=avatarVideos[1-avatarLayer];
  target.pause();target.classList.remove('active');target.dataset.state=state;target.loop=!reduced;target.src=src;target.currentTime=0;
  const ready=target.readyState>=2?Promise.resolve():new Promise((resolve,reject)=>{
    const ok=()=>{cleanup();resolve();},bad=()=>{cleanup();reject(new Error('video load failed'));};
    const cleanup=()=>{target.removeEventListener('loadeddata',ok);target.removeEventListener('error',bad);};
    target.addEventListener('loadeddata',ok,{once:true});target.addEventListener('error',bad,{once:true});
  });
  ready.then(()=>{
    if(request!==avatarRequest)return;
    if(reduced){target.pause();target.currentTime=0;target.classList.add('active');old.classList.remove('active');old.pause();avatarLayer=1-avatarLayer;avatarPending=false;return;}
    return target.play().then(()=>{
      if(request!==avatarRequest){target.pause();return;}
      if(target.readyState<2){target.pause();throw new Error('video frame unavailable');}
      target.classList.add('active');old.classList.remove('active');avatarLayer=1-avatarLayer;
      avatarPending=false;
      setTimeout(()=>{if(!old.classList.contains('active'))old.pause();},390);
    });
  }).catch(()=>{if(request===avatarRequest){avatarPending=false;avatarFailed=true;avatarRoot.replaceChildren();}});
}
const avatar=new XiaoliAvatarState(showAvatar); showAvatar('idle');
window.__xiaoliSetAvatarState=s=>avatar.set(s);
avatarVideos.forEach(v=>v.addEventListener('error',()=>{avatarFailed=true;avatarRoot.replaceChildren();}));
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>showAvatar(avatarState));
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const chips = document.getElementById('chips');
const wake = document.getElementById('wake');
const history = [];   // {role, content}
let busy = false;
let chatAbort;
let recording = null;
const pageBuild=document.querySelector('meta[name="xiaoli-build"]')?.content;
let reloading=false, reloadSeen=[];
try {
  reloadSeen=JSON.parse(sessionStorage.getItem('xiaoli-reload-seen')||'[]');
  if(!Array.isArray(reloadSeen)) reloadSeen=[];
  const draft=sessionStorage.getItem('xiaoli-update-draft');
  if(draft!==null){input.value=draft;sessionStorage.removeItem('xiaoli-update-draft');}
} catch(e) {}
function reloadForBuild(serverBuild,force=false) {
  if(reloading || !XiaoliBuild.shouldReload(pageBuild,serverBuild,reloadSeen,force)) return false;
  reloading=true;reloadSeen.push(serverBuild);
  const draft=input.value;
  try {
    sessionStorage.setItem('xiaoli-update-draft',draft);
    sessionStorage.setItem('xiaoli-reload-seen',JSON.stringify(reloadSeen));
  } catch(e) {}
  chatMode.close();cancelMic();chatAbort?.abort();stopAudio();
  location.reload();
  return true;
}



// Sentence pipeline: reveal each sentence when its audio starts; one synthesis at a time,
// playback in order, with synthesis of the next sentence overlapping playback.
const voice = document.getElementById('voice');
let muted = false;
try { muted = localStorage.getItem('xiaoli-muted') === 'true'; } catch(e) {}
let audioContext, activeSource, audioEpoch = 0;
let ttsWarningEpoch=-1;
let flushSubtitle = null;
let lastSendAt = null;
let synthChain = Promise.resolve(), playChain = Promise.resolve();
function voiceLabel() {
  voice.textContent = muted ? '声音关闭' : '声音开启';
  voice.setAttribute('aria-pressed', String(muted));
  voice.setAttribute('aria-label', muted ? '开启声音' : '关闭声音');
  voice.title = muted ? '点击开启回复朗读' : '点击关闭回复朗读；浏览器首次播放需点击页面';
}
voiceLabel();
function stopAudio() {
  if (flushSubtitle) { flushSubtitle(); flushSubtitle = null; }
  audioEpoch++;
  if (activeSource) { try { activeSource.stop(); } catch(e) {} activeSource = null; }
  if(avatarState==='speaking') avatar.set('idle');
}
function unlockAudio() {
  if (!audioContext) audioContext = new AudioContext();
  if (audioContext.state === 'suspended' && !ttsSuspended) audioContext.resume().catch(() => {});
}
voice.onclick = () => {
  muted = !muted;
  try { localStorage.setItem('xiaoli-muted', String(muted)); } catch(e) {}
  stopAudio(); voiceLabel();
  if (!muted) unlockAudio();
};
document.addEventListener('pointerdown', () => { if (!muted) unlockAudio(); });
document.addEventListener('keydown', () => { if (!muted) unlockAudio(); });
function spoken(t) {
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/<[^>]*>|https?:\/\/\S+/g, '')
    .replace(/[^\p{L}\p{N}\s。，！？!?；;：:、,.…（）()'\-]/gu, '').trim();
}
function queueSentence(text, reveal = () => {}) {
  text = spoken(text);
  if (recording || muted || !audioContext || audioContext.state !== 'running') { reveal(); return; }
  if (!/[\p{L}\p{N}]/u.test(text)) { playChain = playChain.then(reveal); return; }
  const epoch = audioEpoch, completed = performance.now();
  const generated = synthChain.then(async () => {
    if (epoch !== audioEpoch || muted) return null;
    try {
      const res = await fetch('/api/tts', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text}), signal: AbortSignal.timeout(35000)});
      if (!res.ok) throw new Error('TTS unavailable');
      if(res.status === 204) return null;
      const wav = await res.arrayBuffer();
      if (epoch !== audioEpoch || muted) return null;
      if (!audioContext || audioContext.state !== 'running') return null;
      return await audioContext.decodeAudioData(wav);
    } catch(e) { console.info('TTS silent fallback', String(e));if(epoch===audioEpoch && chatMode.enabled && ttsWarningEpoch!==epoch){ttsWarningEpoch=epoch;addBubble('her','声音暂时没准备好，我先用文字陪你聊。');}return null; }
  });
  synthChain = generated.then(() => {});
  playChain = playChain.then(async () => {
    const buffer = await generated;
    if(epoch!==audioEpoch) return;
    reveal();
    if (!buffer || recording || muted || epoch !== audioEpoch) return;
    await new Promise(resolve => {
      const source = audioContext.createBufferSource();
      source.buffer = buffer; source.connect(audioContext.destination); activeSource = source;
      source.onended = () => { console.info('TTS_END',JSON.stringify({at:performance.now(),epoch}));if (activeSource === source) activeSource = null; resolve(); };
      console.info('TTS_PLAY', JSON.stringify({text, delay_ms:performance.now()-completed, duration:buffer.duration, send_to_play_ms:lastSendAt === null ? null : performance.now()-lastSendAt, output_latency_ms:1000*(audioContext.outputLatency || audioContext.baseLatency || 0)}));
      chatMode.speaking(chatMode.epoch);
      avatar.set('speaking');
      source.start();
    });
  }).catch(e => console.info('TTS playback fallback', String(e)));
}
function sentenceStream(onSentence = () => {}) {
  let consumed = 0;
  return (text, final = false) => {
    let rest = text.slice(consumed);
    while (rest.length) {
      let n = rest.search(/[。！？!?；;…\n]/u);
      n = n >= 0 ? n + 1 : 0;
      // Start speaking at the first natural clause, with a 12-character cap.
      // Later chunks retain longer phrasing and synthesize during playback.
      if (consumed === 0) {
        const clause = rest.search(/[，,、：:]/u);
        if (clause >= 0 && (!n || clause + 1 < n)) n = clause + 1;
        if ((!n || n > 12) && rest.length >= 12) n = 12;
      }
      // Avoid very long utterances: comma after 24 chars, hard cap 72 chars.
      if (!n || n > 72) {
        const comma = rest.slice(24,72).search(/[，,、：:]/u);
        n = comma >= 0 ? 25 + comma : (rest.length >= 72 ? 72 : 0);
      }
      if (!n && final) n = rest.length;
      if (!n) break;
      const sentence = rest.slice(0,n);
      consumed += n;
      const prefix = text.slice(0,consumed);
      queueSentence(sentence, () => onSentence(prefix));
      rest = rest.slice(n);
    }
  };
}

// Keep the app alive while this window is open.
try { new EventSource('/api/alive'); } catch (e) {}

function greetingWord() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return '早上好';
  if (h >= 11 && h < 13) return '中午好';
  if (h >= 13 && h < 18) return '下午好';
  return '晚上好';
}

// Keep 小离 (right side of the picture) clear of the UI: pick the background offset that pushes her
// right edge (~77% of the image) to the window's right edge, then size the subtitle column and
// input bar so they end before her shoulder (~40% of the image width).
const app = document.querySelector('.app');
function layout() {
  const W = innerWidth, H = innerHeight, s = Math.max(W / 1654, H / 951), iw = 1654 * s;
  const off = Math.min(iw - W, Math.max(0, 0.77 * iw - W));
  app.style.backgroundPosition = (-off) + 'px center';
  const root = document.documentElement.style;
  if (W < 760) { root.removeProperty('--column'); root.removeProperty('--composer'); return; }
  const safe = 0.40 * iw - off - 24;   // px from the left edge where her shoulder begins
  root.setProperty('--column', Math.round(Math.max(300, Math.min(560, safe - 40))) + 'px');
  root.setProperty('--composer', Math.round(Math.max(340, Math.min(520, safe - 40 - 84))) + 'px');
}
layout();
addEventListener('resize', layout);

function updateClock() {
  const now = new Date();
  document.getElementById('date').textContent = '今天 · 周' + '日一二三四五六'[now.getDay()] + ' · ' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
  document.getElementById('greeting').textContent = greetingWord() + ' · ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}
updateClock();
setInterval(updateClock, 30000);

// Remove any thinking text and simple formatting marks the small model may produce.
function tidy(t) {
  t = t.replace(/<think>[\s\S]*?<\/think>/g, '').replace(/<think>[\s\S]*$/, '').replace(/<\/?think>/g, '');
  t = t.replace(/\/no_think/g, '').replace(/\*\*/g, '').replace(/^#{1,6}\s*/gm, '');
  return t.replace(/[ \t]+\n/g, '\n').replace(/^\s+/, '');
}

function addBubble(who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'me' ? 'me' : 'her');
  d.textContent = text;
  if (who === 'me') {
    for (const message of chat.children) message.classList.add('older');
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function typingBubble() {
  const d = addBubble('her', '');
  d.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  return d;
}

function setBusy(b) {
  busy = b;
  send.disabled = b || chatMode.enabled;
  input.disabled = false;
  if (!b) input.focus();
  if(b) avatar.set('thinking');
}

async function typeOut(el, text) {
  el.textContent = '';
  for (const ch of text) {
    el.textContent += ch;
    chat.scrollTop = chat.scrollHeight;
    await new Promise(r => setTimeout(r, 28));
  }
}

function showChips() {
  const ideas = ['帮我写一条请假消息', '这条短信是不是骗子？', '今晚吃点什么好？', '陪我随便聊聊'];
  chips.innerHTML = '';
  for (const s of ideas) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = s;
    b.onclick = () => { input.value = s; ask(); };
    chips.appendChild(b);
  }
  chips.classList.remove('hidden');
}

async function ask(fromChat=false) {
  if(chatMode.enabled && fromChat!==true) return;
  if (recorder.requestSend()) return;
  const text = input.value.trim();
  if (!text || busy) return;
  const chatRound=chatMode.enabled ? chatMode.epoch : -1;
  stopAudio();setBusy(true);
  if (!muted) {await resumeTTS();unlockAudio();if(audioContext?.state==='suspended') await Promise.race([audioContext.resume().catch(()=>{}),micWait(800)]);}
  chips.classList.add('hidden');
  input.value = ''; autosize();
  addBubble('me', text);
  history.push({ role: 'user', content: text });
  setBusy(true);
  const bubble = typingBubble();
  let raw = '';
  let revealed = 0;
  const reveal = text => {
    if (text.length < revealed) return;
    revealed = text.length; bubble.textContent = text; chat.scrollTop = chat.scrollHeight;
  };
  flushSubtitle = () => reveal(tidy(raw));
  lastSendAt = performance.now();
  const speak = sentenceStream(reveal);
  const controller = new AbortController(); chatAbort = controller;
  const responseTimeout=setTimeout(()=>controller.abort(),90000);
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      signal: controller.signal, body: JSON.stringify({ messages: history.slice(-20) })
    });
    if (!res.ok || !res.body) throw new Error('bad');
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (controller.signal.aborted) throw new Error('aborted');
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const j = JSON.parse(data);
          const piece = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (piece) {
            if(!raw) avatar.set('speaking');
            raw += piece;
            const shown = tidy(raw);
            if (shown) {
              if (muted || !audioContext || audioContext.state !== 'running') reveal(shown);
              speak(shown);
            }
          }
        } catch (e) {}
      }
    }
    const final = tidy(raw).trim();
    if (!final) throw new Error('empty');
    speak(final, true);
    history.push({ role: 'assistant', content: final });
  } catch (e) {
    if(chatAbort!==controller) {clearTimeout(responseTimeout);return;}
    stopAudio();
    if (controller.signal.aborted) {
      bubble.textContent = tidy(raw).trim() || '我在听，你说。';
      if (raw.trim()) history.push({role:'assistant', content:tidy(raw)});
    } else {
      avatar.set('sorry');
      bubble.textContent = '哎呀，我刚才走神了，没听清。你能再说一遍吗？';
      history.pop();
    }
  }
  clearTimeout(responseTimeout);
  if(chatAbort===controller) setBusy(false);
  await synthChain; await playChain;
  if(!chatMode.enabled && !recording) avatar.set('idle');
  chatMode.done(chatRound);
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; document.documentElement.style.setProperty('--input-height', Math.max(52, input.offsetHeight + 12) + 'px'); }
input.addEventListener('input', autosize);
autosize();
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); ask(); }
});
send.onclick = ask;


const chatButton=document.getElementById('chat-mode');
const chatMode=new XiaoliChat({
  delay:(fn,ms)=>setTimeout(fn,ms),
  state(state) {
    avatar.set(state==='listening'?'listening':state==='thinking'?'thinking':state==='speaking'?'speaking':'idle');
    chatButton.setAttribute('aria-pressed',String(chatMode.enabled));
    send.disabled=busy || chatMode.enabled;
    if(typeof mic!=='undefined') mic.setAttribute('aria-label',chatMode.enabled ? '打断当前轮，重新听你说' : '点按开始，再点结束；按住说话，滑出取消');
    const label={listening:'听你说',thinking:'思考中',speaking:'小离在说',guard:'稍等，马上听你说',off:''}[state];
    asrStatus.textContent=label;asrStatus.classList.toggle('hidden',!label);
  },
  listen(){recorder.down(performance.now(),input.value,input.selectionStart);recorder.pressAt=null;},
  finish(){recorder.stop();},
  cancel(){cancelMic();chatAbort?.abort();chatAbort=null;setBusy(false);stopAudio();synthChain=Promise.resolve();playChain=Promise.resolve();}
});
chatButton.onclick=()=>{if(chatMode.enabled)chatMode.close();else if(!mic.disabled)chatMode.open();};
const mic = document.getElementById('mic');
try { localStorage.removeItem('xiaoli-asr-auto-send'); } catch(e) {}
let micCleanup = Promise.resolve();
let micFailed = false, asrEverReady = false, micWarned = false;
const asrStatus=document.getElementById('asr-status');
function micState() {
  mic.classList.toggle('listening', !!recording);
  mic.setAttribute('aria-pressed',String(!!recording));
  mic.setAttribute('aria-label',chatMode.enabled ? '打断当前轮，重新听你说' : recording ? '正在听，再点结束；Esc 取消' : '点按开始，再点结束；按住说话，滑出取消');
}
let pendingMicSession='',ttsSuspended=false,ttsResume=Promise.resolve();
const micWait=ms=>new Promise(r=>setTimeout(r,ms));
function resumeTTS() {
  if(ttsSuspended && !muted && audioContext) {
    ttsSuspended=false;ttsResume=Promise.race([audioContext.resume().catch(()=>{}),micWait(800)]);
  }
  return ttsResume;
}
function micLog(event,stage,err={},rec=recording) {
  const data={event,stage,name:err.name||'',message:err.serverMessage||err.message||'',status:err.status||0,action:err.action||'',
    muted,ttsState:audioContext?.state||'none',ttsRate:audioContext?.sampleRate||0,ttsPlaying:!!activeSource,
    micRate:rec?.context?.sampleRate||0,chatMode:chatMode.state,ua:navigator.userAgent};
  if(stage==='chunk') Object.assign(data,err.chunkStats||{});
  console.warn(data);fetch('/api/log',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(()=>{});
}
function reportMicFailure(stage,err) {
  micLog('mic_failure',stage,err);
  let message='这次没听清，先打字告诉我吧。';
  if(['NotAllowedError','SecurityError'].includes(err.name)) message='麦克风还没获准使用，先打字告诉我吧。';
  else if(['NotFoundError','OverconstrainedError'].includes(err.name)) message='没有找到麦克风，先打字告诉我吧。';
  else if(['NotReadableError','AbortError'].includes(err.name)) message='麦克风正被占用或在切换设备（比如蓝牙耳机），稍等一下再点一次。';
  else if([409,429].includes(err.status)) message='上一段录音还在收尾，稍等一秒再点。';
  else if(err.status===503) message='耳朵暂时没准备好，先打字告诉我吧。';
  else if(err.name==='TimeoutError') message='我这会儿听得有点慢，先打字告诉我吧。';
  else if(['audiocontext','worklet','source','resume'].includes(stage)) message='录音通道没打开，先打字告诉我吧。';
  micFailure(message+'（代码 '+(err.status||err.name||'Error')+'@'+stage+'）');
}
function releaseMic(rec) {
  if (rec.timer) clearTimeout(rec.timer);
  if (rec.stream) rec.stream.getTracks().forEach(t => t.stop());
  if (rec.node) rec.node.disconnect();
  if (rec.source) rec.source.disconnect();
  if (rec.context && rec.context.state!=='closed') rec.context.close().catch(()=>{});
  resumeTTS();
}
async function asrRequest(body) {
  let r;try {r = await fetch('/api/asr',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),signal:AbortSignal.timeout(12000)});} catch(e) {throw Object.assign(new Error(e.message),{name:e.name,status:0,action:body.action,serverMessage:''});}
  if(r.status===426) {
    let build;
    try {build=(await (await fetch('/api/status',{cache:'no-store'})).json()).build;} catch(e) {}
    if(reloading || reloadForBuild(build || 'protocol-426',true)) return new Promise(()=>{});
    chatMode.close();cancelMic();
    throw Object.assign(new Error('client outdated'),{name:'ASRError',status:426,action:body.action,serverMessage:'client outdated'});
  }
  if (!r.ok) {let b={};try {b=await r.json();} catch(e) {if(e.name==='TimeoutError') throw Object.assign(new Error(e.message),{name:e.name,status:r.status,action:body.action,serverMessage:''});}
    throw Object.assign(new Error(b.message||'ASR unavailable'),{name:'ASRError',status:r.status,action:body.action,serverMessage:b.message||''});}
  try {return await r.json();} catch(e) {throw Object.assign(new Error(e.message),{name:e.name,status:r.status,action:body.action,serverMessage:''});}
}
const recorder=new XiaoliRecording({
  render(value,temporary,status) {
    if(value!==null) input.value=value;
    input.classList.toggle('asr-partial',temporary);
    input.readOnly=temporary; // Freeze the snapshot until final or explicit cancellation.
    if(chatMode.enabled) status={listening:'听你说',thinking:'思考中',speaking:'小离在说',guard:'稍等，马上听你说'}[chatMode.state]||status;
    asrStatus.textContent=status;asrStatus.classList.toggle('hidden',!status);autosize();
  },
  start(rec) { if(chatMode.enabled) rec.chatEpoch=chatMode.epoch;recording=rec;avatar.set('listening');micState();startMic(rec); },
  finish(rec) { finishMic(rec); },
  cancel(rec) {
    recording=null;releaseMic(rec);micState();
    if(!chatMode.enabled) avatar.set('idle');
    // Invalidate locally immediately. Also notify Go while finish may own the pipe.
    const remote=rec.session ? asrRequest({action:'cancel',session:rec.session}).then(()=>{if(pendingMicSession===rec.session) pendingMicSession='';}).catch(()=>{}) : Promise.resolve();
    micCleanup=Promise.all([rec.setup?.catch(()=>{}),rec.chain?.catch(()=>{}),remote]).then(()=>{});
  },
  committed(rec,text) {
    recording=null;releaseMic(rec);micState();input.focus();
    if(rec.chatEpoch!==undefined) {
      if(chatMode.final(rec.chatEpoch,text)) ask(true);
      else input.value=rec.draft;
    } else avatar.set('idle');
    console.info('ASR_FINAL',JSON.stringify({text,at:performance.now()}));
  },
  async send(rec) {
    const value=input.value;
    // An aborted old chat may still be unwinding when a short final arrives.
    while(busy && recorder.epoch===rec.epoch) await new Promise(r=>setTimeout(r,20));
    if(recorder.epoch===rec.epoch && input.value===value) ask();
  }
});
function cancelMic() { recorder.cancel(); }
function micFailure(message) { avatar.set('sorry');if(chatMode.enabled) chatMode.close();cancelMic();addBubble('her',message); }
function queueChunk(rec,data) {
  if(!recorder.live(rec) || !data.samples.length) return;
  const chunkStats={n:data.samples.length,validSamples:data.validSamples,maxAbs:Array.from(data.samples).reduce((m,v)=>Math.max(m,Number.isFinite(v)?Math.abs(v):0),0)};
  if(++rec.queued>16) {reportMicFailure('chunk',Object.assign(new Error('chunk backlog'),{name:'TimeoutError',chunkStats}));return;}
  rec.chain=rec.chain.then(async()=>{
    if(!recorder.live(rec)) return;
    const result=await asrRequest({action:'chunk',session:rec.session,
      samples:Array.from(data.samples),validSamples:data.validSamples});
    recorder.result(rec,result);
    if(rec.chatEpoch!==undefined) chatMode.activity(rec.chatEpoch,result.voiceActive===true,data.validSamples/16);
  }).catch(e=>{
    if(e.status===400 && pendingMicSession===rec.session) pendingMicSession='';
    if(recorder.live(rec)) reportMicFailure('chunk',Object.assign(e,{chunkStats}));
  })
    .finally(()=>{rec.queued--;});
}
function startMic(rec) {
  rec.chain=Promise.resolve();rec.queued=0;
  const cleanup=micCleanup;
  chips.classList.add('hidden');
  stopAudio();if(chatAbort) chatAbort.abort();
  rec.setup=(async()=>{
    let stage='getUserMedia',since=performance.now();const timings={};
    const mark=s=>{const now=performance.now();timings[stage]=(timings[stage]||0)+Math.round(now-since);since=now;stage=s;};
    try {
      const capture=()=>navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true},video:false});
      try {rec.stream=await capture();} catch(e) {
        if(!['NotReadableError','AbortError'].includes(e.name)) throw e;
        if(audioContext?.state==='running') {ttsSuspended=true;await audioContext.suspend();}
        console.warn('MIC_RETRY getUserMedia',e.name);await micWait(600);
        if(!recorder.live(rec)) {resumeTTS();return;}
        rec.stream=await capture();
      }
      if(!recorder.live(rec)) {releaseMic(rec);return;}
      // A hold released while permission was pending must never open later.
      if(rec.phase==='finishing') {cancelMic();return;}
      await cleanup;
      if(!recorder.live(rec)) {releaseMic(rec);return;}
      mark('asr-start');
      if(pendingMicSession) {const old=pendingMicSession;pendingMicSession='';await asrRequest({action:'cancel',session:old}).catch(()=>{});} // best effort: 409 stale means already released
      let started;
      for(let attempt=0;;attempt++) {
        try {started=await asrRequest({action:'start'});break;}
        catch(e) {if(![409,429].includes(e.status)||attempt>=3) throw e;await micWait(400);if(!recorder.live(rec)) return;}
      }
      rec.session=started.session;pendingMicSession=rec.session;
      if(!recorder.live(rec)) {releaseMic(rec);await asrRequest({action:'cancel',session:rec.session}).catch(()=>{});return;}
      mark('audiocontext');
      try {rec.context=new AudioContext({sampleRate:16000});} catch(e) {rec.context=new AudioContext();}
      if(rec.context.sampleRate!==16000) {await rec.context.close();rec.context=new AudioContext();}
      mark('source');
      try {rec.source=rec.context.createMediaStreamSource(rec.stream);}
      catch(e) {await rec.context.close();mark('audiocontext');rec.context=new AudioContext();mark('source');rec.source=rec.context.createMediaStreamSource(rec.stream);}
      mark('worklet');
      await rec.context.audioWorklet.addModule('/asr-capture.js');
      if(!recorder.live(rec)) {releaseMic(rec);return;}
      rec.node=new AudioWorkletNode(rec.context,'xiaoli-capture',{processorOptions:{inputRate:rec.context.sampleRate}});
      rec.node.port.onmessage=({data})=>{
        if(data.kind==='flushed') {rec.flushAck?.();return;}
        if(data.kind==='chunk') queueChunk(rec,data);
      };
      mark('source');rec.source.connect(rec.node);rec.node.connect(rec.context.destination);
      mark('resume');await rec.context.resume();
      if(!recorder.live(rec)) {releaseMic(rec);return;}
      recorder.ready(rec);mark('listening');
      micLog('mic_start','resume',{message:JSON.stringify(timings)},rec);
      console.info('ASR_LISTEN',JSON.stringify({at:performance.now(),chatEpoch:rec.chatEpoch}));
      rec.timer=setTimeout(()=>{if(recorder.live(rec)) recorder.stop();},30000);
    } catch(e) {
      if(!recorder.live(rec)) {releaseMic(rec);return;}
      reportMicFailure(stage,e);
    }
  })();
}
async function finishMic(rec) {
  // Freeze physical capture at the chat endpoint; flush only the retained tail.
  if(rec.chatEpoch!==undefined) rec.stream?.getTracks().forEach(t=>t.stop());
  try {
    await rec.setup;
    if(!recorder.live(rec)) return;
    if(!rec.node) {cancelMic();return;}
    await new Promise((resolve,reject)=>{
      const timeout=setTimeout(()=>reject(Object.assign(new Error('flush timeout'),{name:'TimeoutError'})),2000);
      rec.flushAck=()=>{clearTimeout(timeout);resolve();};
      rec.node.port.postMessage({kind:'flush',id:rec.epoch});
    });
    releaseMic(rec);
    await rec.chain; // Port FIFO ensures the tail was appended before flush ACK.
    if(!recorder.live(rec)) return;
    const final=await asrRequest({action:'finish',session:rec.session});
    if(pendingMicSession===rec.session) pendingMicSession='';
    recorder.result(rec,final);
  } catch(e) {if(recorder.live(rec)) reportMicFailure('finish',e);}
}
mic.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;if(chatMode.enabled){e.preventDefault();chatMode.interrupt();return;}e.preventDefault();mic.setPointerCapture(e.pointerId);
  recorder.down(performance.now(),input.value,input.selectionStart);
});
mic.addEventListener('pointerup',e=>{e.preventDefault();recorder.up(performance.now());});
mic.addEventListener('pointermove',e=>{
  const r=mic.getBoundingClientRect();recorder.move(e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom);
});
mic.addEventListener('pointercancel',cancelMic);
mic.addEventListener('keydown',e=>{
  if((e.key===' ' || e.key==='Enter') && !e.repeat) {if(chatMode.enabled){e.preventDefault();chatMode.interrupt();return;}e.preventDefault();recorder.down(performance.now(),input.value,input.selectionStart);}
});
mic.addEventListener('keyup',e=>{if(e.key===' ' || e.key==='Enter') {e.preventDefault();recorder.up(performance.now());}});
window.addEventListener('keydown',e=>{if(e.key==='Escape') {chatMode.close();cancelMic();}});
function suspendChat() {
  if(chatMode.enabled){chatMode.close();addBubble('her','聊天模式已暂停，回来后可以再点开。');}
  cancelMic();
}
window.addEventListener('blur',suspendChat);
document.addEventListener('visibilitychange',()=>{if(document.hidden) suspendChat();});
let partialWarned=false;
async function pollASR() {
  try {
    const s=await (await fetch('/api/status',{cache:'no-store'})).json();
    if(reloadForBuild(s.build)) return;
    if(s.asr_ready) asrEverReady=true;
    if(s.asr_ready && !s.asr_partial && !partialWarned) {
      partialWarned=true;addBubble('her','实时预览暂时没准备好，松开后仍会整理文字。');
    }
    mic.disabled=micFailed || !s.asr_ready || !s.ready;
    if(!s.asr_ready && (asrEverReady || s.asr_finished) && !micWarned) {
      micWarned=true; if(chatMode.enabled)chatMode.close();if(recording) cancelMic();
      reportMicFailure('poll',Object.assign(new Error('asr_ready false'),{name:'ASRError',status:503}));
    }
  } catch(e) {mic.disabled=true;}
  setTimeout(pollASR,1000);
}
pollASR();
window.addEventListener('pagehide',()=>{chatMode.close();cancelMic();});

async function waitForBrain() {
  for (;;) {
    try {
      const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
      if (reloadForBuild(s.build)) return false;
      if (s.ready) return true;
      if (s.failed) { wake.innerHTML = s.message || '小离没能醒来，请关掉窗口再试一次。'; return false; }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 500));
  }
}

(async () => {
  const ok = await waitForBrain();
  if (!ok) return;
  wake.classList.add('hidden');
  const hello = greetingWord() + '呀！我是小离～\n有什么想问的、想聊的，直接在下面打字告诉我就好。不知道说什么的话，点点下面的小卡片也行。';
  const b = addBubble('her', '');
  if (audioContext && audioContext.state === 'running') sentenceStream()(hello, true);
  await typeOut(b, hello);
  history.push({ role: 'assistant', content: hello });
  showChips();
  input.disabled = false; send.disabled = false; input.focus();
})();
